<!DOCTYPE html>
<html>

            <li>Best offers</li>
            <li>Fast delivery</li>
          </ul>
        </td>
      </tr>
    </table>

    <hr>

    <h3>Steps</h3>

    <table align="center">
      <tr>
        <td>
          <ol type="1">
            <li>Enter your name</li>
            <li>Enter email and mobile number</li>
            <li>Click Submit</li>
          </ol>

      </tr>
    </table>
