
<!DOCTYPE html>
<html>
<head>
    <title>Birthday Reminder</title>
    <link rel="stylesheet" href="task6.css">
</head>
<body>

    <div class="container">
        <h1>🎂 Birthday Reminder</h1>

        <h3 id="today"></h3>

        <input type="text" id="name" placeholder="Enter name">
        <input type="date" id="date">

        <button onclick="addBirthday()">Add Birthday</button>

        <input type="text" id="search" placeholder="Search name"
            oninput="displayBirthdays()">

        <button onclick="showAll()">Show All</button>
        <button onclick="showUpcoming()">Upcoming Birthdays</button>

        <h2>Birthday List</h2>
        <ul id="list"></ul>
    </div>

    <script src="task6.js"></script>
</body>
</html>
